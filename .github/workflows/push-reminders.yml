name: Send reminder notifications

# Pings the app every 5 minutes so it can send any reminders that are due.
# Needs two repository secrets: APP_URL (e.g. https://bloom-trail-ten.vercel.app)
# and CRON_SECRET (same value as the CRON_SECRET env var in Vercel).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the notification endpoint
        run: |
          curl -fsS --max-time 50 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/push"
